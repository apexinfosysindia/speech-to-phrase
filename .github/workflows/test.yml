---
name: Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ${{ fromJSON(vars.APEXOS_RUNSON_AMD64 || '["self-hosted","apexos-builder","linux","X64"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

      - name: Install dependencies
        run: script/setup --dev

      - name: Run tests
        run: script/test_ci
