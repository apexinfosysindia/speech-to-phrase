---
name: Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ${{ fromJSON(vars.APEXOS_RUNSON_AMD64 || '["self-hosted","apexos-builder","linux","X64"]') }}
    env:
      # apexil / apexos-intents are published on the org wheelhouse, not PyPI
      PIP_EXTRA_INDEX_URL: https://wheels.apexinfosys.in/simple/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

      - name: Provide OpenFST tools on the builder (Ubuntu ships no OpenGRM package)
        run: |
          if ! command -v fstcompile >/dev/null; then
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libfst-tools
          fi
          fstcompile --version | head -1

      - name: Install dependencies
        run: script/setup --dev

      - name: Run tests
        run: script/test_ci
